<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Lato:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/icons/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/popups.css">

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js" defer></script>
  <script src="js/script.js" defer></script>
  <script src="js/popups.js" defer></script>
  <script src="js/form.js" defer></script>
</head>

<body class="day-mode">

  <button id="theme-toggle" class="theme-toggle" aria-label="Alternar modo dia/noite">
    <img id="theme-icon" src="images/Assets/Sky Switch - Light.svg" alt="Sky Switch">
  </button>

  <!-- Pop-ups -->
  <img id="me" class="scene-popup" src="images/Assets/Me day.svg" alt="Me">
  <img id="box-vinyl" class="scene-popup" src="images/Assets/Box vinyl day.svg" alt="Caixa de vinis">
  <img id="phone" class="scene-popup" src="images/Assets/Phone day.svg" alt="Telefone">
  <img id="laptop" class="scene-popup" src="images/Assets/laptop day.svg" alt="Laptop">

  <!-- Gerativos -->
  <div id="cat" class="scene-generative cat-container">
    <img id="cat-normal" src="images/Assets/Cat day.svg" alt="Gato">
    <img id="cat-hover" src="images/Assets/Cat night eyes closed.svg" alt="" aria-hidden="true">
  </div>
  <div id="vinyl-player-wrap" class="scene-generative vinyl-player-wrap">
    <img id="vinyl-player" src="images/Assets/Vinyl player day.svg" alt="Gira-discos">
    <span class="vinyl-tooltip">Duplo clique para abrir o player</span>
  </div>

  <!-- Estáticos -->
  <img id="lp" class="scene-static" src="images/Assets/LP day.svg" alt="Vinyl">

  <!-- Pop-up Skills -->
  <div id="popup-skills" class="popup-overlay">
    <div class="popup-box skills-popup">
      <img id="popup-skills-img" class="skills-bg" src="images/popups/skills day.svg" alt="Skills">
      <button class="popup-close-btn" onclick="closePopup('popup-skills')" aria-label="Fechar">
        <img src="images/icons/close.svg" alt="Fechar">
      </button>
      <div class="skills-overlay">
        <h2 class="popup-title skills-title">As minhas skills</h2>
        <div class="skills-icons">
          <img src="images/icons/skills/html.svg" alt="HTML">
          <img src="images/icons/skills/css.svg" alt="CSS">
          <img src="images/icons/skills/figma.svg" alt="Figma">
          <img src="images/icons/skills/javascript.svg" alt="JavaScript">
          <img src="images/icons/skills/bootstrap.svg" alt="Bootstrap">
          <img src="images/icons/skills/wordpress.svg" alt="WordPress">
          <img src="images/icons/skills/illustrator.svg" alt="Illustrator">
          <img src="images/icons/skills/nodejs.svg" alt="Node.js">
          <img src="images/icons/skills/react.svg" alt="React">
        </div>
        <div class="skills-cv">
          <img class="skills-cv-icon" src="images/icons/cv.svg" alt="CV">
          <a class="popup-action-btn skills-download-btn" href="documents/CV_VanessaSilva.pdf" download>
            DOWNLOAD CV
            <img src="images/icons/download.svg" alt="">
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Pop-up Contacts -->
  <div id="popup-contacts" class="popup-overlay">
    <div class="popup-box agenda-popup">
      <img class="agenda-bg" src="images/popups/contacts.svg" alt="Contacts">
      <button class="popup-close-btn" onclick="closePopup('popup-contacts')" aria-label="Fechar">
        <img src="images/icons/close.svg" alt="Fechar">
      </button>
      <div class="agenda-overlay">
        <h2 class="popup-title agenda-title">CONTACTOS</h2>
        <div class="sticky-note">
          <img class="sticky-note-bg" src="images/Assets/StickyNote.svg" alt="">
          <div class="sticky-note-links">
            <a href="tel:+351938427903"><img src="images/icons/phone.svg" alt="Telefone">+ 351 938427903</a>
            <a href="mailto:vanessacarosilva@gmail.com"><img src="images/icons/email.svg"
                alt="Email">vanessacarosilva@gmail.com</a>
            <a href="https://linkedin.com/in/vanessamgsilva" target="_blank"><img src="images/icons/linkedin.svg"
                alt="LinkedIn">in/vanessamgsilva</a>
            <a href="https://github.com/vanessapnk" target="_blank"><img src="images/icons/github.svg"
                alt="GitHub">vanessapnk</a>
          </div>
        </div>
        <p class="agenda-form-label">Vamos conversar?</p>
        <form id="contactForm" class="agenda-form" onsubmit="return false;">
          <div class="agenda-form-row">
            <div class="agenda-field">
              <label for="name">Nome*</label>
              <input type="text" name="name" required>
            </div>
            <div class="agenda-field">
              <label for="email">Email*</label>
              <input type="email" name="email" required>
            </div>
          </div>
          <div class="agenda-field">
            <label for="message">Mensagem*</label>
            <textarea rows="3" name="message"></textarea>
            <div class="agenda-form-footer">
              <button type="submit" class="popup-action-btn agenda-submit">SUBMETER</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Pop-up About Me -->
  <div id="popup-about" class="popup-overlay">
    <div class="popup-box">
      <button class="popup-close-btn" onclick="closePopup('popup-about')" aria-label="Fechar">
        <img src="images/icons/close.svg" alt="Fechar">
      </button>
      <img src="images/popups/about me.svg" alt="About Me">
    </div>
  </div>

  <!-- Pop-up Vinyl Player -->
  <div id="popup-vinyl" class="popup-overlay">
    <div class="popup-box vinyl-popup">
      <button class="popup-close-btn" onclick="closePopup('popup-vinyl')" aria-label="Fechar">
        <img src="images/icons/close.svg" alt="Fechar">
      </button>
      <img id="vinyl-popup-bg" class="vinyl-bg" src="images/popups/vinyl-player-top-night.svg" alt="Vinyl Player">

      <div class="vinyl-disc-wrap">
        <img id="vinyl-disc" class="vinyl-disc" src="images/Assets/vinyl-night.svg" alt="">
      </div>

      <img id="vinyl-tonearm" class="vinyl-tonearm" src="images/popups/vinyl-player-top-night.svg" alt="">

      <span class="vinyl-track-name" id="vinyl-track-name"></span>

      <div class="vinyl-controls">
        <!-- Previous -->
        <button class="vinyl-btn" id="vinyl-prev" aria-label="Anterior">
          <img id="vinyl-prev-icon" src="images/icons/Previous-night.svg" alt="Anterior">
        </button>

        <!-- Play / Pause -->
        <button class="vinyl-btn" id="vinyl-play" aria-label="Play / Pause">
          <img id="vinyl-play-icon" class="icon-play" src="images/icons/Play-night.svg" alt="Play">
          <img id="vinyl-pause-icon" class="icon-pause" src="images/icons/Pause-night.svg" alt="Pause"
            style="display:none">
        </button>

        <!-- Skip -->
        <button class="vinyl-btn" id="vinyl-skip" aria-label="Seguinte">
          <img id="vinyl-skip-icon" src="images/icons/Skip-night.svg" alt="Seguinte">
        </button>

        <!-- Speaker icon -->
        <div class="vinyl-speaker">
          <img id="vinyl-speaker-icon" src="images/icons/speaker-night.svg" alt="Volume">
        </div>

        <!-- Volume slider -->
        <div class="vinyl-volume" id="vinyl-volume">
          <div class="vinyl-vol-track">
            <div class="vinyl-vol-fill" id="vinyl-vol-fill"></div>
          </div>
          <div class="vinyl-vol-thumb" id="vinyl-vol-thumb"></div>
        </div>
      </div>
    </div>
  </div>


</body>

</html>
